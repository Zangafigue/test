<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
            color: #222;
        }

        .container {
            max-width: 700px;
            margin: 80px auto;
            padding: 32px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 2rem;
        }

        p {
            margin-top: 0;
            color: #555;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 24px 0 0;
            display: grid;
            gap: 12px;
        }

        a {
            display: block;
            padding: 14px 16px;
            border: 1px solid #d9dee6;
            border-radius: 8px;
            text-decoration: none;
            color: #1a4fa3;
            font-weight: 600;
            background: #f8fbff;
        }

        a:hover {
            background: #edf4ff;
            border-color: #bdd2f2;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Bienvenue</h1>
        <p>Accédez rapidement aux pages principales du site :</p>
        <ul>
            <li><a href="/about.html">À propos</a></li>
            <li><a href="/contact.html">Contact</a></li>
            <li><a href="/faq.html">FAQ</a></li>
            <li><a href="/explore.html">Explorer</a></li>
        </ul>
    </main>
</body>
</html>
